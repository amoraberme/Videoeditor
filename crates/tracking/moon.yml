$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'library'

tasks:
  check:
    command: 'cargo check'
    inputs:
      - 'src/**/*'
      - 'examples/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    command: 'cargo test'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
